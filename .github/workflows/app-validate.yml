name: App Validate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'public/**'
      - 'api/**'
      - 'optimizer-worker/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'eslint.config.js'
      - '.github/workflows/app-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint app
        run: pnpm lint

      - name: Type-check app
        run: pnpm type-check

      - name: Build app
        run: pnpm build

      - name: Build optimizer worker image
        run: docker build -t poe-optimizer-worker-ci ./optimizer-worker
